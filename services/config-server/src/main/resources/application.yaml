server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/abdou50855/ticketflow-config.git
          default-label: main
          clone-on-start: true
          refresh-rate: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info