<div class="container">
  <h2>Liste des Clients</h2>

  <table *ngIf="customers.length > 0; else noClients">
    <thead>
      <tr>
        <th>ID</th>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Email</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of customers">
        <td>{{ c.id }}</td>
        <td>{{ c.firstName }}</td>
        <td>{{ c.lastName }}</td>
        <td>{{ c.email }}</td>
        <td>
          <button (click)="editCustomer(c)" style="cursor: pointer; border: none; background: none;">✏️</button>
          <button (click)="deleteCustomer(c.id)" style="color: red; cursor: pointer; border: none; background: none;">❌</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noClients>
    <p>Aucun client trouvé (ou erreur de connexion).</p>
  </ng-template>
</div>
